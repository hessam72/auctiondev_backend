    post:
      summary: message
      tags:
        - Support
      security:
        - oAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Message'
      description: 'save message'
      responses:
        '200':
          description: object
        '400':
          description: Bad Reuest
        '500':
          description: Server Internal Error

  # end done
  /users/newpassword:
