openapi: 3.0.0
info:
  title: 'My App APIs '
  description: MyApp V1
  version: v1
servers:
  - url: 'https://api.mozamona.com/api/'
    description: Auction API
  - url: 'http://localhost:3003/api/'
    description: SwaggerHub API Auto Mocking
tags:
  - name: Auth
    description: Auth account
  - name: User
    description: Users description
  - name: Plan
    description: Plan Api
  - name: Category
    description: Category Api
  - name: Product
