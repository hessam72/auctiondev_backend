paths:
  /auth/login:
    post:
      summary: login
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: 'Login with username and password'
      responses:
        '200':
          description: object
        '500':
          description: Server Internal Error
  /auth/register:
    post:
      summary: register
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
      description: 'Register with mobile and username and password'
      responses:
        '200':
          description: object
        '500':
          description: Server Internal Error
  /auth/verify:
    put:
      summary: verify
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify'
      description: 'sign user and resive jwt token'
      responses:
        '200':
          description: object
        '500':
          description: Server Internal Error
  /auth/otp:
    post:
      summary: otp
      tags:
        - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Otp'
      description: 'Resend code and forget password'
      responses:
        '200':
          description: object
        '500':
          description: Server Internal Error
  /setting/about:
    get:
      tags:
        - About
      summary: Get once saved about
      description: about
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResContent'
        '500':
          description: Server Internal Error
  /setting/rule:
    get:
      tags:
        - Rule
      summary: Get once saved rule
      description: rule
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResContent'
        '500':
          description: Server Internal Error
  /notify:
    get:
      summary: notify
      tags:
        - Notify
      security:
        - oAuth: []
      description: 'get list of notify'
      responses:
        '200':
          description: object
        '400':
          description: Bad Reuest
        '500':
          description: Server Internal Error
  /message:
    get:
      summary: message
