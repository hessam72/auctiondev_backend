components:
  parameters:
    tagsParam:
      name: tags
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      example:
        - "موتور"
        - "انتظامی"
    searchParam:
      name: search
      in: query
      description: 'search in title'
      required: false
      schema:
        type: string
        default: ''
    locationParam:
      name: location
      in: query
      description: 'search in location'
      required: false
      schema:
        type: string
        default: ''
    categoryParam:
      name: categories
      in: query
      description: 'filter by category'
      required: false
      schema:
        type: array
        items:
          type: string
      example:
        - "5f29983101c5dc001f30e98f"
        - "5f29981b01c5dc001f30e98e"
    uuidParam:
      name: uuid
      in: path
      description: 'uuid'
      required: true
      schema:
        type: string
        default: '000000000000000000000'
  securitySchemes:
    oAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Favorite:
      type: object
      properties:
        productId:
          type: string
          default: "000000000000000000000"
      example:
        productId: "000000000000000000000"
    Notify:
      type: object
      properties:
        title:
          type: string
          default: "title"
        message:
          type: string
          default: "message"
      example:
        title: "title"
        message: "message"
    Message:
      type: object
      properties:
        title:
          type: string
          default: "title"
        message:
          type: string
          default: "message"
      example:
        title: "title"
        message: "message"
    Verify:
      type: object
      properties:
        mobile:
          type: string
          default: "09332369461"
        code:
          type: string
          default: 9461
      example:
        mobile: "09332369461"
        code: "9461"
    NewPassword:
      type: object
      properties:
        password:
          type: string
          default: "123456"
        passwordConfirm:
          type: string
          default: "123456"
    Otp:
      type: object
      properties:
        mobile:
          type: string
          default: "09332369461"
    Register:
      type: object
      properties:
        mobile:
          type: string
          default: "09332369461"
        username:
          type: string
          default: sajadweb
        password:
          type: string
          default: password
      example:
        mobile: "09332369461"
        username: "sajadweb"
        password: "123456"
    Profile:
      type: object
      properties:
        mobile:
          type: string
          default: "09332369461"
        name:
          type: string
          default: name
        password:
          type: string
          default: password
      example:
        name: "sajjad"
        mobile: "09332369461"
        password: "123456"
    User:
      type: object
      properties:
        mobile:
          type: string
          default: "09332369461"
        name:
          type: string
          default: name
        username:
          type: string
          default: username
        password:
          type: string
          default: password
      example:
        name: "sajjad"
        mobile: "09332369461"
        password: "123456"
    Login:
      type: object
      properties:
        username:
          type: string
          default: react
        password:
          type: string
          default: password
      example:
        username: 'sajadweb'
        password: '123456'
    Category:
      type: object
      properties:
        title:
          type: string
          default: react
        icon:
          type: string
          default: icon
        parentId:
          type: string
          default: null
    Plan:
      type: object
      properties:
        title:
          type: string
          default: react
        price:
          type: string
          default: 200
        event:
          type: string
          default: null
        duration:
          type: string
          default: "once"
    Setting:
      type: object
      properties:
        type:
          type: string
          default: react
        content:
          type: string
          default: icon
    Transaction:
      type: object
      properties:
        amount:
          type: number
          default: 100
        description:
          type: string
          default: null
        gateway:
          type: number
          default: 1
          description: 'please set 1 for NextPay and for bazar set 2 and wallet set 3'
        type:
          type: string
          default: "wallet"
          description: 'wallet and plan'
        plan:
          type: string
          default: "id"
        product:
          type: string
          default: "id"
      example:
        amount: 2000
        description: 'charge wallet'
        gateway: 1
        type: "wallet"
    ResContent:
      type: object
      properties:
        content:
          type: string
          default: 'content'
      example:
        content: 'content'
    Amount:
      type: object
      required: ['amount']
      properties:
        amount:
          type: number
        createdAt:
          type: string
        updatedAt:
          type: string
      example:
        amount: 200
        createdAt: "12/11/2020"
        updatedAt: "12/11/2020"
    File:
      type: object
      required: ['path']
      properties:
        path:
          type: string
        free:
          type: boolean
        hero:
         type: boolean
        order:
          type: number
          default: 0
        createdAt:
          type: string
        updatedAt:
          type: string
      example:
        path: "http://acution.apipicker.ir/path.png"
        free: true
        hero: true
    Product:
      type: object
      properties:
        title:
          type: string
          default: react
        description:
          type: string
          default: null
        amount:
          $ref: '#/components/schemas/Amount'
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
        tags:
          type: array
          items:
             type: string
        category:
          $ref: '#/components/schemas/Category'
